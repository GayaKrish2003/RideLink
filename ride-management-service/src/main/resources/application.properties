spring.application.name=ride-management-service
server.port=8083

# PostgreSQL - finalized per group agreement (own database, never shared)
spring.datasource.url=jdbc:postgresql://localhost:5432/riddb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# JWT - must match the claims/secret agreed across all 4 services
jwt.secret=${JWT_SECRET:...}

# URLs of the other services this service calls
services.driver-service.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
services.fare-service.base-url=${FARE_SERVICE_URL:http://localhost:8084}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
