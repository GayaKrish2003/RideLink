# CI pipeline for the Account Service only.
# Each microservice has its own separate workflow file (ci-<service-name>.yml)
# so that teammates never edit the same file and never hit merge conflicts.

name: Account Service CI

# Run this pipeline whenever code is pushed to these branches,
# or when a pull request targets main/develop.
on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-account-service:
    runs-on: ubuntu-latest
    steps:
      # Pull the repo's code into the CI runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Java 17, which this Spring Boot service requires
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build account-service and run its unit tests.
      # --file scopes this to account-service/pom.xml only,
      # so other services aren't touched by this pipeline.
      - name: Build and run tests
        run: mvn -B test --file account-service/pom.xml